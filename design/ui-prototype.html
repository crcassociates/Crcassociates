        const status = r.effective_from > TODAY ? 'Scheduled' : r === cur ? 'In effect' : 'Replaced';
        return h('tr', null,
          h('td', null, r.effective_from === RULES_START ? 'From the start' : fmtDate(r.effective_from, { dow: true, year: true })),
          h('td', { class: 'num' }, `${fh(r.threshold)} h`),
          h('td', null, dayRangeLabel(r.weekend_days)),
          h('td', { class: 'wrap' }, r.note),
          h('td', null, h('span', { class: 'badge ' + status.toLowerCase().replace(' ', '-'), style: { marginLeft: '0' } }, status)),
          h('td', { class: 'num' }, status === 'Scheduled' && S.role === 'admin'
            ? h('button', { class: 'btn sm ghost', type: 'button', onclick: () => confirmDialog({
              title: 'Cancel this rule change?',
              text: `The change planned for ${fmtDate(r.effective_from, { dow: true, year: true })} will not happen. The current rules stay in effect.`,
              confirmLabel: 'Cancel change',
              danger: true,
              onConfirm: () => { RULES.splice(RULES.indexOf(r), 1); render(); toast('Rule change cancelled.'); },
            }) }, 'Cancel change')
            : null));
      })))));
}

function openRuleDialog() {
  const cur = ruleFor(TODAY);
  const nextMonday = addDays(weekStart(TODAY), 7);
  const dateIn = h('input', { type: 'date', value: nextMonday });
  const thresholdIn = h('input', { type: 'number', id: 'rule-threshold', min: '0.25', max: '24', step: '0.25', value: String(cur.threshold), inputmode: 'decimal', style: { width: '120px' } });
  const noteIn = h('textarea', { rows: '2', placeholder: 'Why is this changing? For example: new labor agreement.' });
  const days = new Set(cur.weekend_days);
  const summary = h('div', { class: 'rule-summary', 'aria-live': 'polite' });
  const err = h('p', { class: 'field-error', role: 'alert' });
  const dayButtons = DOW.map((name, i) => {
    const day = i + 1;
    const b = h('button', {
      class: 'day-toggle', type: 'button', 'aria-pressed': String(days.has(day)), 'aria-label': DOW_LONG[i],
      onclick: () => { if (days.has(day)) days.delete(day); else days.add(day); b.setAttribute('aria-pressed', String(days.has(day))); update(); },
    }, name);
    return b;
  });

  // Returns a problem that blocks saving, or null.
  const problem = () => {
    const date = dateIn.value;
    const threshold = Number(thresholdIn.value);
    if (!isDate(date)) return 'Pick a start date.';
    if (!(threshold > 0 && threshold <= 24)) return 'Enter hours between 0.25 and 24.';
    if (RULES.some((r) => r.effective_from === date)) return 'There is already a rule starting on this date.';
    const before = ruleFor(date);
    if (before && before.threshold === threshold && sortedDays(before.weekend_days).join() === sortedDays(days).join()) return 'Nothing would change: this matches the rule already in effect on that date.';
    if (!noteIn.value.trim()) return 'Add a short note so others know why the rules changed.';
    return null;
  };

  function update() {
    const date = dateIn.value;
    const threshold = Number(thresholdIn.value);
    summary.replaceChildren();
    if (!isDate(date) || !(threshold > 0 && threshold <= 24)) return;
    const wk = sortedDays(days);
    const weekdays = [1, 2, 3, 4, 5, 6, 7].filter((d) => !days.has(d));
    summary.append(
      h('strong', null, `From ${fmtDate(date, { dow: true, year: true })}:`), ' ',
      weekdays.length ? `on ${dayRangeLabel(weekdays)}, hours on one project over ${fh(threshold)} in a day are OT. ` : '',
      wk.length ? `On ${weekendNames(wk)}, all hours are OT. ` : 'No weekend days. ',
      `Reports before ${fmtDate(date, { year: true })} do not change.`);
    if (date <= TODAY) {
      summary.append(notice('warn', h('strong', null, 'This date is not in the future. '),
        `Hours from ${fmtDate(date, { year: true })} to today will be recalculated, including weeks that may already have been paid.`));
    }
  }
  dateIn.addEventListener('input', update);
  thresholdIn.addEventListener('input', update);
  update();

  openDialog({
    title: 'Schedule an OT rule change',
    width: '620px',
    body: [
      h('p', { class: 'muted' }, 'The new rule applies from its start date. Earlier dates keep the rules that applied then.'),
      h('div', { class: 'field-row' },
        field('Starts on', dateIn),
        h('div', { class: 'field' },
          h('label', { for: 'rule-threshold' }, 'Weekday OT after'),
          h('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } }, thresholdIn, h('span', { class: 'muted' }, 'hours on one project in a day')))),
      h('div', { class: 'field' }, h('span', { style: { fontWeight: 550, fontSize: '13px' }, id: 'weekend-label' }, 'Weekend days (all hours OT)'),
        h('div', { class: 'day-toggles', role: 'group', 'aria-labelledby': 'weekend-label' }, dayButtons)),
      field('Note', noteIn),
      summary,
      err,
    ],
    actions: (api) => [
      h('button', { class: 'btn', type: 'button', onclick: () => api.close() }, 'Cancel'),
      h('button', {
        class: 'btn primary', type: 'button',
        onclick: () => {
          const issue = problem();
          if (issue) { err.textContent = issue; return; }
          const date = dateIn.value;
          RULES.push({ id: nextRuleId++, effective_from: date, threshold: Number(thresholdIn.value), weekend_days: sortedDays(days), note: noteIn.value.trim() });
          api.close();
          render();
          toast(date > TODAY ? `Rule change scheduled for ${fmtDate(date, { year: true })}.` : `Rule change saved. Hours from ${fmtDate(date, { year: true })} on are recalculated.`);
        },
      }, 'Save rule change'),
    ],
  });
}

function usersPanel() {
  const roleLabel = (role) => (role === 'admin' ? 'Admin' : 'Viewer');
  const tbody = h('tbody', null, S.users.map((u) => h('tr', null,
    h('th', { scope: 'row' }, u.name || h('span', { class: 'muted' }, 'Invited'), u.you ? h('span', { class: 'badge' }, 'You') : null),
    h('td', null, u.email),
    h('td', null, u.you ? roleLabel(u.role) : h('select', {
      class: 'role-select', 'aria-label': `Role for ${u.name || u.email}`, value: u.role,
      onchange: (e) => { u.role = e.target.value; toast(`${u.name || u.email} is now ${roleLabel(u.role).toLowerCase() === 'admin' ? 'an admin' : 'a viewer'}.`); },
    }, h('option', { value: 'viewer' }, 'Viewer'), h('option', { value: 'admin' }, 'Admin'))),
    h('td', null, u.invited ? h('span', { class: 'status' }, statusIcon('off'), `Invite sent ${fmtWhen(u.invited)}`) : fmtWhen(u.last)),
    h('td', { class: 'num' }, u.you ? null : h('button', {
      class: 'btn sm ghost', type: 'button',
      onclick: () => confirmDialog({
        title: u.invited ? 'Cancel this invite?' : `Remove ${u.name}?`,
        text: u.invited ? `${u.email} won’t be able to sign in.` : `${u.name} won’t be able to sign in any more. You can invite them again later.`,
        confirmLabel: u.invited ? 'Cancel invite' : 'Remove',
        danger: true,
        onConfirm: () => { S.users.splice(S.users.indexOf(u), 1); render(); toast(u.invited ? 'Invite cancelled.' : `${u.name} removed.`); },
      }),
    }, u.invited ? 'Cancel invite' : 'Remove')))));
  return [
    h('p', { class: 'lede' }, 'Only people on this list can sign in. They get a sign-in link by email, so there are no passwords to manage.'),
    h('section', { class: 'card' },
      h('div', { class: 'card-head' },
        h('h2', { class: 'card-title' }, 'Users'),
        h('span', { class: 'count' }, plural(S.users.length, 'person', 'people')),
        h('div', { class: 'spacer' }),
        h('button', { class: 'btn', type: 'button', onclick: openInviteDialog }, icon('plus'), 'Invite someone')),
      h('div', { class: 'table-wrap' }, h('table', { class: 'data' },
        h('thead', null, h('tr', null, th('Name'), th('Email'), th('Role'), th('Last sign-in'), h('th', { scope: 'col' }, h('span', { class: 'sr-only' }, 'Actions')))),
        tbody))),
    h('section', { class: 'card' },
      h('div', { class: 'card-head' }, h('h2', { class: 'card-title' }, 'Roles')),
      h('div', { class: 'card-body roles' },
        h('div', null, h('strong', null, 'Viewer'), h('p', null, 'Sees hours for any date range and exports Excel reports. Can see the OT rules and the sync status.')),
        h('div', null, h('strong', null, 'Admin'), h('p', null, 'Everything a viewer can do, plus: runs and re-imports the Raken sync, reconnects Raken, schedules OT rule changes and manages users.')))),
  ];
}

function openInviteDialog() {
  const email = h('input', { type: 'email', placeholder: 'name@company.com', autocomplete: 'off' });
  const role = h('select', null, h('option', { value: 'viewer' }, 'Viewer'), h('option', { value: 'admin' }, 'Admin'));
  const err = h('p', { class: 'field-error', role: 'alert' });
  openDialog({
    title: 'Invite someone',
    body: [h('p', { class: 'muted' }, 'They get an email with a sign-in link.'), field('Email', email), field('Role', role), err],
    actions: (api) => [
      h('button', { class: 'btn', type: 'button', onclick: () => api.close() }, 'Cancel'),
      h('button', {
        class: 'btn primary', type: 'button',
        onclick: () => {
          const value = email.value.trim();
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(value)) { err.textContent = 'Enter an email address.'; email.focus(); return; }
          if (S.users.some((u) => u.email.toLowerCase() === value.toLowerCase())) { err.textContent = 'This person is already on the list.'; return; }
          S.users.push({ name: null, email: value, role: role.value, invited: NOW });
          api.close();
          render();
          toast(`Prototype: an invite would be emailed to ${value}.`);
        },
      }, icon('mail'), 'Send invite'),
    ],
  });
}

function pageLogin() {
  document.title = 'Sign in · CRC Associates Hours';
  const brand = h('div', { class: 'login-brand' },
    h('span', { class: 'brand-mark', 'aria-hidden': 'true' }, 'CRC'),
    h('div', null, h('div', { class: 'brand-name' }, 'CRC Associates'), h('div', { class: 'muted small' }, 'Hours')));
  if (S.loginSent) {
    return h('div', { class: 'login-wrap' }, h('main', { class: 'card login-card' }, brand,
      h('h1', null, 'Check your email'),
      h('p', null, 'We sent a sign-in link to ', h('strong', null, S.loginSent), '. It works once, for one hour.'),
      h('p', { class: 'muted small', style: { marginTop: '10px' } }, 'No email after a few minutes? Check your spam folder, or ',
        h('button', { class: 'btn-link', type: 'button', onclick: () => { S.loginSent = null; render(); } }, 'try again'), '.'),
      h('button', { class: 'btn block proto-only', type: 'button', onclick: () => { S.loginSent = null; S.signedIn = true; go('/hours'); } }, 'Prototype: open the sign-in link')));
  }
  const email = h('input', { type: 'email', autocomplete: 'email', placeholder: 'name@company.com' });
  const err = h('p', { class: 'field-error', role: 'alert' });
  return h('div', { class: 'login-wrap' }, h('main', { class: 'card login-card' }, brand,
    h('h1', null, 'Sign in'),
    h('p', { class: 'muted' }, 'Enter your work email and we’ll send you a sign-in link. No password needed.'),
    h('form', {
      novalidate: true,
      onsubmit: (e) => {
        e.preventDefault();
        const value = email.value.trim();
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(value)) { err.textContent = 'Enter your work email address.'; email.focus(); return; }
        S.loginSent = value;
        render();
      },
    }, field('Work email', email), err, h('button', { class: 'btn primary block', type: 'submit' }, icon('mail'), 'Email me a sign-in link')),
    h('p', { class: 'login-foot muted small' }, 'Access is by invitation. If you can’t sign in, ask an admin to invite you.')));
}

function protoPanel() {
  const seg = (label, key, options, after) => h('div', { class: 'proto-group' },
    h('span', null, label),
    h('div', { class: 'proto-seg' }, options.map(([value, text]) => h('button', {
      type: 'button', 'aria-pressed': String(S[key] === value),
      onclick: () => { S[key] = value; if (after) after(value); render(); },
    }, text))));
  const body = S.protoOpen ? h('div', { class: 'proto-body', id: 'proto-body' },
    h('h2', null, 'Prototype controls'),
    h('p', { class: 'proto-note', style: { marginTop: '0' } }, 'Not part of the app. Switch situations to see how each screen handles them.'),
    seg('Situation', 'scenario', [['normal', 'All good'], ['failed', 'Sync failing'], ['disconnected', 'Not connected']], () => { S.running = null; S.extraRuns = []; }),
    seg('Signed in as', 'role', [['admin', 'Admin'], ['viewer', 'Viewer']]),
    seg('Theme', 'theme', [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']]),
    h('div', { class: 'proto-links' },
      h('a', { href: href('/hours/employee/1', { from: '2026-09-14', to: '2026-09-20' }) }, 'Marcus Reyes, week of Sep 14 (the examples)'),
      h('button', { type: 'button', onclick: () => { S.signedIn = false; S.loginSent = null; go('/login'); } }, 'Sign-in page')),
    h('p', { class: 'proto-note' }, 'Sample data. “Today” is Sat, Sep 26, 2026. Marcus Reyes’s week of Sep 14 is the example week from REQUIREMENTS.md.')) : null;
  return h('aside', { class: 'proto', 'aria-label': 'Prototype controls' }, body,
    h('button', {
      class: 'proto-toggle', type: 'button', 'aria-expanded': String(S.protoOpen), 'aria-controls': 'proto-body',
      onclick: () => { S.protoOpen = !S.protoOpen; render(); },
    }, icon(S.protoOpen ? 'chevronDown' : 'sliders'), 'Prototype'));
}

// Prototype only: ?scenario=failed|disconnected, ?role=viewer, ?theme=dark and
// ?controls=open preset the controls above, so any situation can be linked.
(function readPrototypeParams() {
  const p = new URLSearchParams(location.search);
  if (['normal', 'failed', 'disconnected'].includes(p.get('scenario'))) S.scenario = p.get('scenario');
  if (['admin', 'viewer'].includes(p.get('role'))) S.role = p.get('role');
  if (['auto', 'light', 'dark'].includes(p.get('theme'))) S.theme = p.get('theme');
  if (p.get('controls') === 'open') S.protoOpen = true;
})();

render();
</script>
